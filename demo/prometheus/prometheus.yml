global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: checkout
    static_configs:
      - targets: ["checkout:8000"]
        labels: {namespace: demo, service: checkout}
  - job_name: alert-triage-bot
    static_configs:
      - targets: ["bot:8080"]
        labels: {namespace: demo, service: alert-triage-bot}
