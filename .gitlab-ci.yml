# lint -> test -> build -> scan -> release
# Every image is pushed with the commit SHA first. It only gets the `latest` or version tag
# after Trivy finds no fixable CRITICAL vulnerability in it.

stages: [lint, test, build, scan, release]

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  IMAGE_SHA: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.trivy-cache

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.python:
  image: python:3.12-slim
  before_script:
    - pip install --quiet uv==0.13.5
    - uv sync --frozen
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]

ruff:
  extends: .python
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

helm:
  stage: lint
  image:
    name: alpine/helm:3.18.4
    entrypoint: [""]
  script:
    - helm lint charts/alert-triage-bot
    - helm template t charts/alert-triage-bot > rendered-default.yaml
    - helm template t charts/alert-triage-bot --set secret.values.WEBHOOK_TOKEN=x --set serviceMonitor.enabled=true > rendered-full.yaml
  artifacts:
    paths: [rendered-*.yaml]
    expire_in: 1 day

kubeconform:
  stage: test
  needs: [helm]
  image:
    name: ghcr.io/yannh/kubeconform:v0.7.0-alpine
    entrypoint: [""]
  script:
    # ServiceMonitor is a CRD with no built-in schema
    - /kubeconform -strict -summary -ignore-missing-schemas rendered-default.yaml rendered-full.yaml

pytest:
  extends: .python
  stage: test
  needs: []
  script:
    - uv run pytest -q --cov --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/^TOTAL.+?(\d+)%$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

.docker:
  image: docker:28.3.3
  services: [docker:28.3.3-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:
  extends: .docker
  stage: build
  needs: [ruff, pytest]
  script:
    - docker pull "$IMAGE:latest" || true
    - docker build --cache-from "$IMAGE:latest" -t "$IMAGE_SHA" .
    - docker push "$IMAGE_SHA"

trivy-image:
  stage: scan
  needs: [build]
  image:
    name: aquasec/trivy:0.65.0
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    # report everything, fail only on CRITICAL that has a fix available
    - trivy image --no-progress --severity HIGH,CRITICAL --format table "$IMAGE_SHA"
    - trivy image --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_SHA"
  cache:
    key: trivy-db
    paths: [.trivy-cache]

trivy-config:
  stage: scan
  needs: []
  image:
    name: aquasec/trivy:0.65.0
    entrypoint: [""]
  script:
    # Dockerfile, compose and Helm chart misconfigurations
    - trivy config --severity HIGH,CRITICAL --exit-code 1 .
  cache:
    key: trivy-db
    paths: [.trivy-cache]

release:
  extends: .docker
  stage: release
  needs: [trivy-image, trivy-config, kubeconform]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables: {RELEASE_TAG: latest}
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      variables: {RELEASE_TAG: $CI_COMMIT_TAG}
  script:
    - docker pull "$IMAGE_SHA"
    - docker tag "$IMAGE_SHA" "$IMAGE:$RELEASE_TAG"
    - docker push "$IMAGE:$RELEASE_TAG"
