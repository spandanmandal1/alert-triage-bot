# Local demo stack, sized for a laptop with ~2 GB free RAM.
# Grafana is optional: `docker compose --profile ui up -d`.
name: alert-triage-bot

x-small: &small
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}

services:
  bot:
    <<: *small
    build: .
    image: alert-triage-bot:dev
    ports: ["8080:8080"]
    environment:
      LOKI_URL: http://loki:3100
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:0.5b}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DRY_RUN: ${DRY_RUN:-true}
      WEBHOOK_TOKEN: demo-local-token
      GRAFANA_URL: http://localhost:3000
    mem_limit: 128m

  checkout:
    <<: *small
    image: python:3.12-slim
    command: ["python", "/app/app.py"]
    volumes: ["./demo/checkout:/app:ro"]
    ports: ["8000:8000"]
    mem_limit: 64m

  prometheus:
    <<: *small
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.external-url=http://localhost:9090
    volumes: ["./demo/prometheus:/etc/prometheus:ro"]
    ports: ["9090:9090"]
    mem_limit: 256m

  alertmanager:
    <<: *small
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./demo/alertmanager:/etc/alertmanager:ro"]
    ports: ["9093:9093"]
    mem_limit: 64m

  loki:
    <<: *small
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes: ["./demo/loki:/etc/loki:ro", "loki-data:/loki"]
    ports: ["3100:3100"]
    mem_limit: 256m

  alloy:
    <<: *small
    image: grafana/alloy:v1.10.0
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    volumes:
      - ./demo/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Start after the containers it ships logs for. When everything started at once, Alloy
    # missed checkout and bot (still being created at its first discovery) and never tailed them.
    depends_on: [loki, bot, checkout]
    mem_limit: 128m

  ollama:
    <<: *small
    image: ollama/ollama:0.11.4
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 24h
    volumes: ["ollama-models:/root/.ollama"]
    ports: ["11434:11434"]
    mem_limit: 1500m

  ollama-pull:
    image: ollama/ollama:0.11.4
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen2.5:0.5b}"]
    environment: {OLLAMA_HOST: "ollama:11434"}
    depends_on: [ollama]
    restart: "no"

  grafana:
    <<: *small
    image: grafana/grafana:12.1.0
    profiles: [ui]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes: ["./demo/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
    mem_limit: 192m

volumes:
  loki-data:
  ollama-models:
